<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b0d">
<title>Casework Software – …made for rehearsal and shows</title>
<meta name="description" content="Casework Software – Software für Musiker auf der Bühne. Erstes Produkt: StageCase, der Musical Director für Ableton Live.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  /* Casework Software (Firmenseite, vorerst auf hennys.de). Systemschrift, keine externen Dateien.
     Das Logo baut sich auf wie ein Case, das zugeklappt wird: Alu-Kante laeuft aus der Mitte, der Verschluss rastet ein,
     CASE/WORK kommen hinter der Kante hervor, dann SOFTWARE und der Slogan. Klick aufs Logo = nochmal. */
  :root { color-scheme: dark; --bg: #0b0b0d; --card: #17171b; --line: #2c2c32; --fg: #f2f2f2; --dim: #a6a6ae; --faint: #6b6b74;
    --metal: #c9ced4; --amber: #ff9f0a; --play: #34c759; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); overflow-x: hidden; }
  body { font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; flex-direction: column; }
  a { color: inherit; }
  .wrap { width: 100%; max-width: 1000px; margin: 0 auto; padding: 0 16px; }
  .head { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; font-size: 14px; color: var(--dim); }
  .head a { text-decoration: none; color: var(--dim); } .head a:hover { color: var(--fg); }
  .lang button { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 6px; padding: 3px 8px; font: 600 12px inherit; cursor: pointer; }
  .lang button.on { color: var(--fg); border-color: var(--faint); }
  main { flex: 1; }

  /* ---------- Logo ---------- */
  .hero { position: relative; display: grid; place-items: center; padding: 9vh 0 6vh; }
  .hero::before { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(600px 260px at 50% 46%, rgba(255,159,10,.10), transparent 70%); opacity: 0; transition: opacity 1.6s ease 1.1s; }
  .hero.go::before { opacity: 1; }
  .logo { width: min(100%, 640px); height: auto; display: block; cursor: pointer; overflow: visible; }
  .logo text { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; }

  /* 1 · Kante laeuft aus der Mitte nach aussen */
  .bar { transform-box: fill-box; transform-origin: 50% 50%; transform: scaleX(0); }
  .go .bar { animation: bar .7s cubic-bezier(.2,.8,.2,1) .15s forwards; }
  @keyframes bar { to { transform: scaleX(1); } }
  /* Glanz, der einmal ueber die Kante faehrt */
  .shine { transform: translateX(-60px); opacity: 0; }
  .go .shine { animation: shine 1.1s ease-in-out 2.5s forwards; }
  @keyframes shine { 0% { transform: translateX(-60px); opacity: 0; } 15% { opacity: .9; } 85% { opacity: .9; } 100% { transform: translateX(470px); opacity: 0; } }

  /* 2 · Verschluss faellt und rastet ein */
  .latch { transform-box: fill-box; transform-origin: 50% 100%; transform: translateY(-46px); opacity: 0; }
  .go .latch { animation: latch .55s cubic-bezier(.3,1.5,.5,1) .8s forwards; }
  @keyframes latch { 0% { transform: translateY(-46px); opacity: 0; } 55% { transform: translateY(2px) scaleY(.86); opacity: 1; } 75% { transform: translateY(-1px) scaleY(1.04); } 100% { transform: none; opacity: 1; } }
  .flash { opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; }
  .go .flash { animation: flash .6s ease-out 1.1s; }
  @keyframes flash { 0% { opacity: .9; transform: scale(.4); } 100% { opacity: 0; transform: scale(2.6); } }

  /* 3 · Buchstaben kommen hinter der Kante hoch (Maske = alles oberhalb der Kante) */
  .ch { transform: translateY(70px); }
  .go .ch { animation: up .62s cubic-bezier(.2,.9,.25,1.08) forwards; animation-delay: calc(1.15s + var(--i) * 55ms); }
  @keyframes up { to { transform: none; } }

  /* 4 · SOFTWARE zieht sich zusammen, 5 · Slogan wird getippt */
  .sw { opacity: 0; letter-spacing: 26px; }
  .go .sw { animation: sw 1s cubic-bezier(.2,.8,.2,1) 1.75s forwards; }
  @keyframes sw { to { opacity: 1; letter-spacing: 8px; } }
  .slogan { opacity: 0; }
  .go .slogan { opacity: 1; transition: opacity .2s 2.4s; }
  .caret { fill: var(--amber); opacity: 0; }
  .go .caret { animation: caret .9s steps(1) 2.4s 4; }
  @keyframes caret { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .bar, .latch, .ch, .sw, .slogan { animation: none !important; transform: none !important; opacity: 1 !important; }
    .sw { letter-spacing: 8px; } .flash, .shine, .caret { display: none; }
  }

  /* ---------- Text und Produkte ---------- */
  .intro { text-align: center; max-width: 640px; margin: 0 auto; color: var(--dim); font-size: 17px;
    opacity: 0; transform: translateY(14px); transition: opacity .8s ease 2.9s, transform .8s ease 2.9s; }
  .go ~ .intro, .intro.go { opacity: 1; transform: none; }
  .intro b { color: var(--fg); }
  h2 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin: 54px 0 14px; text-align: center; }
  .prods { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; margin-bottom: 56px; }
  .prod { position: relative; display: flex; flex-direction: column; gap: 12px; padding: 22px; border-radius: 18px; text-decoration: none;
    background: linear-gradient(160deg, rgba(255,159,10,.10), var(--card) 60%); border: 1px solid var(--line); transition: transform .2s, border-color .2s;
    opacity: 0; transform: translateY(18px); }
  .shown .prod { animation: card .7s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(3.1s + var(--i) * .12s); }
  @keyframes card { to { opacity: 1; transform: none; } }
  .prod:hover { border-color: var(--amber); transform: translateY(-3px); }
  .prod svg { width: 100%; max-width: 300px; height: auto; }
  .prod p { margin: 0; color: var(--dim); font-size: 14.5px; }
  .prod .go-to { margin-top: auto; font-weight: 700; color: var(--amber); font-size: 14px; }
  .prod.soon { background: var(--card); border-style: dashed; cursor: default; }
  .prod.soon:hover { border-color: var(--line); transform: none; }
  .prod.soon b { font-size: 19px; }
  .prod.soon em { font-style: normal; font-size: 11px; font-weight: 800; letter-spacing: .1em; color: var(--faint); }

  footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding: 20px 0 26px; border-top: 1px solid var(--line); color: var(--faint); font-size: 13px; }
  footer a { color: var(--faint); text-decoration: none; margin-left: 16px; } footer a:hover { color: var(--fg); }
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><a href="../">← hennys.de</a><span class="lang"><button type="button" data-l="de">DE</button> <button type="button" data-l="en">EN</button></span></div>
</div>
<main class="wrap" id="main">
  <section class="hero" id="hero">
    <svg class="logo" id="logo" viewBox="0 0 480 190" role="img" aria-label="Casework Software – …made for rehearsal and shows">
      <defs>
        <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef1f4"/><stop offset=".5" stop-color="#c9ced4"/><stop offset="1" stop-color="#8d949b"/></linearGradient>
        <linearGradient id="amb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc35a"/><stop offset="1" stop-color="#e88a00"/></linearGradient>
        <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <clipPath id="above"><rect x="0" y="0" width="480" height="104"/></clipPath>
        <clipPath id="barclip"><rect x="40" y="104" width="400" height="7" rx="3.5"/></clipPath>
      </defs>
      <!-- CASE fett, WORK hell; einzelne Buchstaben, damit sie nacheinander hochkommen -->
      <g clip-path="url(#above)" font-size="72" fill="#f2f2f2">
        <text id="word" x="240" y="94" text-anchor="middle" letter-spacing="3"><tspan font-weight="900">CASE</tspan><tspan font-weight="300">WORK</tspan></text>
      </g>
      <rect class="bar" x="40" y="104" width="400" height="7" rx="3.5" fill="url(#alu)"/>
      <g clip-path="url(#barclip)"><rect class="shine" x="40" y="104" width="60" height="7" fill="url(#gl)"/></g>
      <circle class="flash" cx="240" cy="107" r="18" fill="#ffb53a"/>
      <g class="latch"><rect x="223" y="96" width="34" height="22" rx="4.5" fill="url(#amb)"/><rect x="233" y="103" width="14" height="6" rx="1.5" fill="#7a4300" opacity=".55"/></g>
      <text class="sw" x="240" y="146" text-anchor="middle" font-size="17" font-weight="600" fill="#9a9aa4">SOFTWARE</text>
      <text class="slogan" id="slogan" x="240" y="178" text-anchor="middle" font-size="19" font-style="italic" font-weight="500" fill="#ff9f0a"></text>
      <rect class="caret" id="caret" x="0" y="163" width="2.2" height="19"/>
    </svg>
  </section>
  <p class="intro" id="intro" data-t="intro"></p>

  <h2 data-t="products"></h2>
  <div class="prods" id="prods">
    <a class="prod" href="../stagecase/" style="--i:0">
      <svg viewBox="0 0 392 110" role="img" aria-label="StageCase">
        <defs><linearGradient id="sv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#d4d9de"/><stop offset="1" stop-color="#a9b0b7"/></linearGradient></defs>
        <g fill="none" stroke="url(#sv)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M344 4 H369 a13 13 0 0 1 13 13 V42"/><path d="M40 98 H15 a13 13 0 0 1 -13 -13 V60"/></g>
        <svg x="20" y="20" width="58" height="58" viewBox="0 0 512 512"><circle cx="256" cy="256" r="176" fill="none" stroke="#2a2a30" stroke-width="44"/>
          <path d="M256 80 A176 176 0 1 1 80 256" fill="none" stroke="#34c759" stroke-width="44" stroke-linecap="round"/><path d="M256 256 V154 A102 102 0 1 1 154 256 Z" fill="#ff9f0a"/></svg>
        <text x="94" y="64" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial" font-weight="800" font-size="42" letter-spacing="-0.5"><tspan fill="#fff">Stage</tspan><tspan fill="#ff9f0a">Case</tspan></text>
        <text x="95" y="85" font-family="-apple-system, Helvetica, Arial" font-size="10.5" letter-spacing="2" fill="#9a9aa4">MUSICAL DIRECTOR FOR ABLETON LIVE</text>
      </svg>
      <p data-t="sc"></p>
      <span class="go-to" data-t="scgo"></span>
    </a>
    <div class="prod soon" style="--i:1"><em data-t="soonb"></em><b data-t="more"></b><p data-t="moretxt"></p></div>
  </div>
</main>
<div class="wrap">
  <footer><span>© 2026 Casework Software – Hendrik Holthaus</span><span><a href="../impressum.html" data-t="imp"></a><a href="../datenschutz.html" data-t="dat"></a></span></footer>
</div>

<script>
(() => {
  const TX = {
    intro: ['Software für Musiker, die live spielen. <b>Casework</b> baut Werkzeuge, die auf der Bühne zuverlässig laufen – vom Proberaum bis zum Auftritt.',
      'Software for musicians who play live. <b>Casework</b> builds tools that just work on stage – from the rehearsal room to the show.'],
    products: ['Produkte', 'Products'],
    sc: ['Der Musical Director für Ableton Live: Looper, Clips, Setlist, Lead Sheet, Mixer, Soundkarte und Licht in einer App – am Mac und auf jedem Tablet.',
      'The musical director for Ableton Live: loopers, clips, setlist, lead sheet, mixer, audio interface and lights in one app – on the Mac and on every tablet.'],
    scgo: ['Zu StageCase →', 'Go to StageCase →'],
    soonb: ['IN PLANUNG', 'IN THE WORKS'],
    more: ['Weitere Werkzeuge', 'More tools'],
    moretxt: ['Lights, Visuals und mehr für die Show – bald.', 'Lights, visuals and more for the show – soon.'],
    imp: ['Impressum', 'Imprint'], dat: ['Datenschutz', 'Privacy'],
  };
  let de = true;
  try { de = (localStorage.getItem('sc-lang') || ((navigator.language || 'de').startsWith('de') ? 'de' : 'en')) === 'de'; } catch (_) {}
  const texts = () => {
    document.documentElement.lang = de ? 'de' : 'en';
    for (const el of document.querySelectorAll('[data-t]')) el.innerHTML = TX[el.dataset.t][de ? 0 : 1];
    for (const b of document.querySelectorAll('.lang button')) b.classList.toggle('on', (b.dataset.l === 'de') === de);
  };
  for (const b of document.querySelectorAll('.lang button')) b.addEventListener('click', () => { de = b.dataset.l === 'de'; try { localStorage.setItem('sc-lang', b.dataset.l); } catch (_) {} texts(); });
  texts();

  // Schriftzug in einzelne Buchstaben zerlegen (gleiche Laufweite wie der fertige Text)
  const word = document.getElementById('word');
  const parts = [...word.children].map((t) => [t.getAttribute('font-weight'), t.textContent]);
  word.textContent = '';
  let i = 0;
  for (const [w, s] of parts) for (const ch of s) {
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
    t.setAttribute('font-weight', w); t.textContent = ch; word.appendChild(t);
  }
  // tspans lassen sich nicht einzeln verschieben -> je Buchstabe ein eigenes <text> an seiner gemessenen Stelle
  const g = word.parentNode, spans = [...word.children];
  const pos = spans.map((t, k) => ({ x: word.getStartPositionOfChar(k).x, ch: t.textContent, w: t.getAttribute('font-weight') }));
  word.remove();
  for (const p of pos) {
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', p.x); t.setAttribute('y', 94); t.setAttribute('font-weight', p.w); t.setAttribute('class', 'ch');
    t.style.setProperty('--i', i++); t.textContent = p.ch; g.appendChild(t);
  }

  // Slogan tippen, Cursor laeuft mit
  const SLOGAN = '…made for rehearsal and shows', sl = document.getElementById('slogan'), caret = document.getElementById('caret');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let timers = [];
  function typeSlogan() {
    sl.textContent = '';
    const step = (n) => {
      sl.textContent = SLOGAN.slice(0, n);
      let x = 240; try { const b = sl.getBBox(); x = n ? b.x + b.width + 3 : 240; } catch (_) {}
      caret.setAttribute('x', x);
      if (n < SLOGAN.length) timers.push(setTimeout(() => step(n + 1), 55));
    };
    timers.push(setTimeout(() => step(0), 2400));
  }

  const hero = document.getElementById('hero'), intro = document.getElementById('intro'), main = document.getElementById('main');
  function play() {
    timers.forEach(clearTimeout); timers = [];
    hero.classList.remove('go');                         // nochmal: nur das Logo, Text und Karten bleiben stehen
    void hero.offsetWidth;
    hero.classList.add('go'); intro.classList.add('go'); main.classList.add('shown');
    if (reduce) sl.textContent = SLOGAN; else typeSlogan();
  }
  document.getElementById('logo').addEventListener('click', play);
  requestAnimationFrame(play);
})();
</script>
</body>
</html>
